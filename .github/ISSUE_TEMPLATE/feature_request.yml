name: Feature request
description: A new capability or an improvement
title: "Add "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What is missing or painful, and for whom.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
  - type: textarea
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
