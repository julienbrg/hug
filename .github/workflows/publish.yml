name: publish

on:
  push:
    branches: [main]
    paths: [article/hug-flow.md]
  workflow_dispatch:

concurrency: publish

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/publish-post.mjs article/hug-flow.md
        env:
          MCP_BEARER_TOKEN: ${{ secrets.MCP_BEARER_TOKEN }}
